name: Auth Gateway CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: auth-gateway-511100
  REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GATEWAY_TEST_DB_PORT: "5432"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/auth-gateway-511100/auth-gateway/auth-gateway:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/942082409962/locations/global/workloadIdentityPools/github/providers/github
          service_account: gateway-deploy@auth-gateway-511100.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and publish image
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Update Cloud Run Jobs
        run: |
          gcloud run jobs update auth-gateway-migrate \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE"
          gcloud run jobs update auth-gateway-cleanup \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE"

      - name: Run database migrations
        run: >-
          gcloud run jobs execute auth-gateway-migrate
          --project "$PROJECT_ID"
          --region "$REGION"
          --wait

      - name: Deploy Cloud Run service
        run: >-
          gcloud run deploy auth-gateway
          --project "$PROJECT_ID"
          --region "$REGION"
          --image "$IMAGE"
          --port 8800
          --quiet
