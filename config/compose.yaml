env: dev
server_addr: ":8800"

db_host: "db"
db_port: 5432
db_user: "postgres"
db_password: "postgres"
db_name: "auth"
db_sslmode: "disable"
db_timezone: "Asia/Tokyo"

zitadel_issuer: "auth.localtest.me"
zitadel_scopes:
  - openid
  - profile
  - email
zitadel_port: 8080
zitadel_insecure: true

session_ttl: 24h
state_ttl: 10m

cookie_secure: false
cookie_same_site: "Lax"

log_level: "debug"
log_format: "pretty"

cors_allow_origins:
  - "http://react.localtest.me:5174"

applications:
  - id: react-app-playground
    origin: "http://react.localtest.me:5174"
    client_id: "389568185071894793"
    session_secret: "0123456789abcdef0123456789abcdef"
    internal_token: "replace-with-react-internal-token"
